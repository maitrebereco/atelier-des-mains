<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mon panier entreprise — Ateliers des Mains</title><style>
:root{font-family:Arial,sans-serif;color:#29201c;background:#f7f2ec}*{box-sizing:border-box}body{margin:0}header{background:#21432c;color:white;padding:22px}header a{color:white}main{max-width:1050px;margin:28px auto;padding:0 20px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}section,aside{background:white;border:1px solid #dcc8b4;border-radius:14px;padding:22px}aside{height:fit-content;position:sticky;top:18px}.item{display:grid;grid-template-columns:100px 1fr;gap:18px;border-bottom:1px solid #eee;padding:18px 0}.item img{width:100px;height:120px;object-fit:contain}.item h2{font-size:18px;margin:0 0 8px}.item p{margin:7px 0;font-size:14px}.quantity{display:flex;align-items:center;gap:8px}.quantity input{width:78px}button,.button{cursor:pointer;border:0;background:#76152b;color:white;padding:12px 18px;border-radius:8px;font-weight:bold;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:default}.secondary{background:#eee;color:#4a262a}.remove{background:none;color:#76152b;padding:6px 0;text-decoration:underline}.total{font-size:27px;font-weight:bold;color:#76152b}#pay{width:100%;font-size:18px}label{display:block;margin:14px 0 5px;font-size:14px}input{width:100%;padding:11px;border:1px solid #d8c5b5;border-radius:7px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}#status{white-space:pre-wrap;line-height:1.5;color:#76152b}#empty{padding:25px 0}#clear{margin-top:18px}#print{margin-top:12px;width:100%}@media(max-width:740px){.layout{grid-template-columns:1fr}aside{position:static}.fields{grid-template-columns:1fr}.item{grid-template-columns:75px 1fr}.item img{width:75px}}@media print{header,button,.button,.quantity,form{display:none!important}.layout{display:block}aside{position:static}section,aside{border:0}body{background:white}}
</style></head><body><header><a href="/fr/cadeaux-entreprise.html">← Continuer mes achats</a><h1>🛒 Mon panier entreprise</h1></header><main><div class="layout"><section><h2>Vos articles</h2><div id="items"></div><div id="empty" hidden>Votre panier est vide. <a href="/fr/cadeaux-entreprise.html">Choisir mes cadeaux</a></div><button class="secondary" id="clear" type="button">Vider le panier</button><h2>Coordonnées et livraison</h2><p>Complétez ces informations pour ouvrir le paiement PayPal.</p><form id="contact"><div class="fields"><div><label for="company">Entreprise</label><input id="company" required maxlength="200" autocomplete="organization"></div><div><label for="name">Nom du contact</label><input id="name" required maxlength="150" autocomplete="name"></div><div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div><div><label for="phone">Téléphone (facultatif)</label><input id="phone" type="tel" maxlength="50" autocomplete="tel"></div><div><label for="address">Adresse de livraison en Suisse</label><input id="address" required maxlength="180" autocomplete="street-address"></div><div><label for="postal">Code postal</label><input id="postal" required maxlength="20" autocomplete="postal-code"></div><div><label for="city">Ville</label><input id="city" required maxlength="100" autocomplete="address-level2"></div></div></form></section><aside><h2>Récapitulatif</h2><p id="count"></p><p class="total" id="total"></p><button id="pay" type="button">Payer mon panier avec PayPal</button><p id="status" role="status"></p><p>Paiement en CHF. Confirmez les articles et le montant sur PayPal avant de payer.</p><button class="secondary" id="print" type="button">Imprimer mon panier / PDF</button></aside></div></main><script src="/assets/js/enterprise-cart.js"></script></body></html>
